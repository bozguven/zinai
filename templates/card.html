<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  @font-face { font-family: 'Unbounded'; font-weight: 800; src: url(fonts/unbounded-latin-800-normal.woff2) format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+2122, U+2212; }
  @font-face { font-family: 'Unbounded'; font-weight: 800; src: url(fonts/unbounded-latin-ext-800-normal.woff2) format('woff2'); unicode-range: U+0100-02AF, U+1E00-1EFF, U+2020, U+20A0-20AB, U+20AD-20CF, U+2113, U+2C60-2C7F, U+A720-A7FF; }
  @font-face { font-family: 'Unbounded'; font-weight: 900; src: url(fonts/unbounded-latin-900-normal.woff2) format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+2122, U+2212; }
  @font-face { font-family: 'Unbounded'; font-weight: 900; src: url(fonts/unbounded-latin-ext-900-normal.woff2) format('woff2'); unicode-range: U+0100-02AF, U+1E00-1EFF, U+2020, U+20A0-20AB, U+20AD-20CF, U+2113, U+2C60-2C7F, U+A720-A7FF; }
  @font-face { font-family: 'Fira Sans Condensed'; font-weight: 400; src: url(fonts/fira-sans-condensed-latin-400-normal.woff2) format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+2122, U+2212; }
  @font-face { font-family: 'Fira Sans Condensed'; font-weight: 400; src: url(fonts/fira-sans-condensed-latin-ext-400-normal.woff2) format('woff2'); unicode-range: U+0100-02AF, U+1E00-1EFF, U+2020, U+20A0-20AB, U+20AD-20CF, U+2113, U+2C60-2C7F, U+A720-A7FF; }
  @font-face { font-family: 'Fira Sans Condensed'; font-weight: 500; src: url(fonts/fira-sans-condensed-latin-500-normal.woff2) format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+2122, U+2212; }
  @font-face { font-family: 'Fira Sans Condensed'; font-weight: 500; src: url(fonts/fira-sans-condensed-latin-ext-500-normal.woff2) format('woff2'); unicode-range: U+0100-02AF, U+1E00-1EFF, U+2020, U+20A0-20AB, U+20AD-20CF, U+2113, U+2C60-2C7F, U+A720-A7FF; }
  @font-face { font-family: 'Fira Sans Condensed'; font-weight: 700; src: url(fonts/fira-sans-condensed-latin-700-normal.woff2) format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+2122, U+2212; }
  @font-face { font-family: 'Fira Sans Condensed'; font-weight: 700; src: url(fonts/fira-sans-condensed-latin-ext-700-normal.woff2) format('woff2'); unicode-range: U+0100-02AF, U+1E00-1EFF, U+2020, U+20A0-20AB, U+20AD-20CF, U+2113, U+2C60-2C7F, U+A720-A7FF; }

  :root {
    --white: #FFFFFF; --bleu: #4F62AE; --encre: #3B3C3E; --fenetre: #DECF58; --pont: #949599;
    --display: 'Unbounded', sans-serif; --text: 'Fira Sans Condensed', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; }
  body { background: #ddd; }
  .card { position: relative; width: 1080px; height: 1350px; overflow: hidden; background: var(--white); color: var(--bleu); font-family: var(--text); }
  .card.story { height: 1920px; }
  .pad { position: absolute; inset: 0; padding: 72px 76px; display: flex; flex-direction: column; z-index: 2; }
  .story .pad { padding: 150px 76px 140px; }

  .top { display: flex; justify-content: space-between; font-weight: 700; font-size: 34px; line-height: 1; }
  .wordmark { font-family: var(--display); font-weight: 900; font-size: 46px; line-height: 0.95; text-transform: uppercase; }
  .wordmark span { display: block; }

  .title { font-family: var(--display); font-weight: 900; text-transform: uppercase; line-height: 0.92; margin-top: 64px; }
  .title .l1 { display: block; font-size: 128px; letter-spacing: -0.01em; }
  .title .l2 { display: block; font-size: 106px; margin-top: 12px; }
  .when { margin-top: 34px; font-weight: 700; font-size: 46px; line-height: 1.15; }

  .kicker { margin-top: 64px; font-weight: 700; font-size: 46px; color: var(--encre); line-height: 1.1; }
  .big { white-space: nowrap; font-family: var(--display); font-weight: 900; line-height: 0.95; margin-top: 18px; letter-spacing: -0.02em; }
  .line { margin-top: 26px; font-weight: 500; font-size: 44px; color: var(--encre); line-height: 1.2; }
  .line b { font-weight: 700; color: var(--bleu); }

  .quote { font-family: var(--display); font-weight: 800; font-size: 76px; line-height: 1.12; margin-top: 90px; max-width: 900px; }
  .names { margin-top: 30px; }
  .names p { font-family: var(--display); font-weight: 900; font-size: 96px; line-height: 1.05; }
  .names p.friends { color: var(--pont); }
  .rows { margin-top: 40px; display: grid; gap: 28px; max-width: 640px; }
  .rows div { border-top: 3px solid var(--bleu); padding-top: 16px; }
  .rows dt { font-weight: 700; font-size: 34px; color: var(--pont); }
  .rows dd { font-weight: 700; font-size: 46px; color: var(--encre); line-height: 1.15; }

  .windows { display: grid; grid-template-columns: repeat(10, 34px); gap: 22px 26px; margin-top: 44px; }
  .windows i { width: 34px; height: 54px; border-radius: 13px 15px 10px 12px; border: 4px solid var(--fenetre); display: block; }
  .windows i.on { background: var(--fenetre); }

  .sticker { margin-top: 56px; width: 100%; height: 420px; border: 5px dashed var(--pont); border-radius: 36px; display: grid; place-items: center; font-weight: 500; font-size: 36px; color: var(--pont); }

  .spacer { flex: 1; }
  .foot { font-weight: 700; font-size: 38px; line-height: 1.2; position: relative; z-index: 3; }
  .foot .venue { color: var(--encre); font-weight: 500; }
  .logos { position: absolute; right: 76px; bottom: 76px; height: 64px; z-index: 3; }
  .story .logos { bottom: 140px; }

  .art { position: absolute; z-index: 1; pointer-events: none; }
  .art.full { left: 20px; width: 1020px; bottom: 175px; }
  .story .art.full { left: -30px; width: 1140px; bottom: 300px; }
  /* Stories: same canvas width, more height, so everything a size up */
  .story .top { font-size: 40px; }
  .story .title { margin-top: 110px; }
  .story .when { font-size: 58px; margin-top: 48px; }
  .story .wordmark { font-size: 60px; }
  .story .kicker { font-size: 60px; margin-top: 110px; }
  .story .line { font-size: 56px; margin-top: 36px; }
  .story .quote { font-size: 92px; margin-top: 120px; }
  .story .foot { font-size: 46px; }
  .story .sticker { height: 340px; }
  .story .windows { grid-template-columns: repeat(10, 40px); gap: 26px 28px; margin-top: 60px; }
  .story .windows i { width: 40px; height: 64px; border-width: 5px; border-radius: 15px 17px 12px 14px; }
  .art.left { left: -10px; bottom: 150px; width: 560px; }
  .story .art.left { bottom: 290px; width: 640px; }
  .art.pylon { right: 0; bottom: 140px; height: 760px; }
  .story .art.pylon { bottom: 280px; height: 1000px; }
</style>
</head>
<body>
<div id="root"></div>
<script>
const L = {
  fr: { credit: 'Eliyo Ruşan FILIZTEK & Friends', date: '27.11.2026', when: 'Vendredi 27 novembre<br>Portes à 20h30', venue: 'Péniche Le Marcounet, Paris', address: "Port des Célestins, Quai de l'Hôtel de Ville, 75004 Paris", friends: '& Friends' },
  tr: { credit: 'Eliyo Ruşan FILIZTEK & Friends', date: '27.11.2026', when: '27 Kasım Cuma<br>Kapılar 20.30', venue: 'Péniche Le Marcounet, Paris', address: "Port des Célestins, Quai de l'Hôtel de Ville, 75004 Paris", friends: '& Friends' },
  en: { credit: 'Eliyo Ruşan FILIZTEK & Friends', date: '27.11.2026', when: 'Friday 27 November<br>Doors 8:30 pm', venue: 'Péniche Le Marcounet, Paris', address: "Port des Célestins, Quai de l'Hôtel de Ville, 75004 Paris", friends: '& Friends' },
};
const esc = (s) => String(s ?? '').replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[c]);
const C = window.CARD || { format: 'post', variant: 'announce', lang: 'fr', fields: {} };
const t = L[C.lang || 'fr'];
const k = C.format !== 'story' ? 1 : (C.variant === 'tickets' || C.variant === 'soldout') ? 1.05 : 1.3;
const f = C.fields || {};
const wordmark = `<div class="wordmark"><span>Bosphore</span><span>sur Seine</span></div>`;
const foot = `<div class="foot">${t.date}<br><span class="venue">${t.venue}</span></div>`;
const windows = (n, lit) => `<div class="windows">${Array.from({ length: n }, (_, i) => `<i class="${i < lit ? 'on' : ''}"></i>`).join('')}</div>`;
const art = { announce: 'full', quote: 'left', tickets: 'pylon', soldout: 'pylon', lineup: 'left', info: 'pylon', countdown: 'full', survey: 'full' }[C.variant] || 'none';
const artFile = { full: '../assets/art.png', left: '../assets/art-left.png', pylon: '../assets/art-pylon.png' }[art];

let body = '';
switch (C.variant) {
  case 'announce':
    body = `<div class="top"><span>${esc(t.credit)}</span><span>${t.date}</span></div>
      <h1 class="title"><span class="l1">Bosphore</span><span class="l2">sur Seine</span></h1>
      <p class="when">${t.when}</p><div class="spacer"></div>
      <div class="foot">${esc(t.address)}</div>`;
    break;
  case 'quote':
    body = `${wordmark}<p class="quote">${esc(f.quote)}</p><div class="spacer"></div>${foot}`;
    break;
  case 'tickets':
  case 'soldout':
    body = `${wordmark}<p class="kicker">${esc(f.kicker)}</p>
      <p class="big" style="font-size:${Math.round((f.bigSize || 300) * k)}px">${esc(f.big)}</p>
      <p class="line">${f.line || ''}</p>
      ${f.windows ? windows(f.windows.count, f.windows.lit) : ''}
      <div class="spacer"></div>${foot}`;
    break;
  case 'lineup':
    body = `${wordmark}<p class="kicker">${esc(f.kicker)}</p>
      <div class="names">${(f.names || []).map((n) => `<p>${esc(n)}</p>`).join('')}<p class="friends">${t.friends}</p></div>
      <div class="spacer"></div>${foot}`;
    break;
  case 'info':
    body = `${wordmark}<p class="kicker">${esc(f.kicker)}</p>
      <dl class="rows">${(f.rows || []).map(([k, v]) => `<div><dt>${esc(k)}</dt><dd>${esc(v)}</dd></div>`).join('')}</dl>
      <div class="spacer"></div>${foot}`;
    break;
  case 'countdown':
    body = `${wordmark}<p class="big" style="font-size:${Math.round((f.bigSize || 360) * k)}px;margin-top:${C.format === 'story' ? 140 : 70}px">${esc(f.big)}</p>
      <p class="line">${f.line || ''}</p><div class="spacer"></div>${foot}`;
    break;
  case 'survey':
    body = `${wordmark}<p class="quote" style="font-size:82px">${esc(f.question)}</p>
      <div class="sticker">${esc(f.stickerHint || '')}</div><div class="spacer"></div>${foot}`;
    break;
}
document.getElementById('root').innerHTML = `<div class="card ${C.format} v-${C.variant}">
  ${artFile ? `<img class="art ${art}" src="${artFile}" alt="">` : ''}
  <div class="pad">${body}</div>
</div>`;
document.fonts.ready.then(() => { document.body.dataset.ready = '1'; });
</script>
</body>
</html>
