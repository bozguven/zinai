<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Unbounded"; font-weight: 900; src: url("assets/fonts/unbounded-latin-900-normal.woff2") format("woff2"); }
      @font-face { font-family: "Fira Sans Condensed"; font-weight: 500; src: url("assets/fonts/fira-sans-condensed-latin-500-normal.woff2") format("woff2"); }
      @font-face { font-family: "Fira Sans Condensed"; font-weight: 700; src: url("assets/fonts/fira-sans-condensed-latin-700-normal.woff2") format("woff2"); }
      :root { --ink: #f6f2e6; --window: #decf58; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: "Fira Sans Condensed", sans-serif; color: var(--ink); }
      .shot { position: absolute; inset: 0; width: 1080px; height: 1920px; object-fit: cover; z-index: 1; }
      .full { position: absolute; inset: 0; }
      #shade { z-index: 2; background: linear-gradient(180deg, #000a 0%, #0004 24%, transparent 40%, transparent 72%, #000a 100%); }
      #black { z-index: 3; background: #000; }
      #endshade { z-index: 3; background: linear-gradient(180deg, #0d1330cc 0%, #0d1330aa 55%, #0d1330ee 100%); }
      .t { position: absolute; left: 0; width: 1080px; text-align: center; z-index: 10; text-wrap: balance; text-shadow: 0 4px 30px #0009; }
      #brand { top: 250px; font: 700 30px/1 "Fira Sans Condensed"; letter-spacing: 0.32em; opacity: 0.9; }
      .hook { top: 560px; padding: 0 70px; font: 900 170px/0.98 "Unbounded"; letter-spacing: -0.04em; }
      .line { top: 600px; padding: 0 120px; font: 900 90px/1.03 "Unbounded"; letter-spacing: -0.03em; }
      .mega { top: 520px; font: 900 300px/0.95 "Unbounded"; letter-spacing: -0.05em; }
      .sub { top: 860px; padding: 0 120px; font: 900 76px/1.05 "Unbounded"; letter-spacing: -0.03em; }
      .tag { top: 470px; font: 700 40px/1 "Fira Sans Condensed"; letter-spacing: 0.24em; color: var(--window); }
      #endline { top: 470px; padding: 0 130px; font: 900 88px/1.04 "Unbounded"; letter-spacing: -0.03em; }
      #info { top: 840px; font: 700 44px/1.35 "Fira Sans Condensed"; }
      #cta { top: 1020px; }
      #cta span { display: inline-block; padding: 18px 40px; border-radius: 999px; background: var(--window); color: #141a3a; font: 700 44px/1 "Fira Sans Condensed"; text-shadow: none; }
      #credit { top: 1270px; font: 500 26px/1 "Fira Sans Condensed"; opacity: 0.75; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6.961" data-width="1080" data-height="1920" data-fps="30">
      <video id="s1" class="shot clip" src="assets/media/p8.mp4" data-start="0.0" data-duration="1.856" data-media-start="14.0" data-track-index="0" muted playsinline></video>
      <video id="s2" class="shot clip" src="assets/media/p9.mp4" data-start="1.856" data-duration="1.856" data-media-start="17.0" data-track-index="0" muted playsinline></video>
      <video id="s3" class="shot clip" src="assets/media/p2.mp4" data-start="3.712" data-duration="3.248" data-media-start="38.5" data-track-index="0" muted playsinline></video>
      <div id="shade" class="full clip" data-start="0" data-duration="6.961" data-track-index="1"></div>
      <div id="black" class="full clip" data-start="0" data-duration="6.961" data-track-index="2"></div>
      <div id="endshade" class="full clip" data-start="4.64" data-duration="2.321" data-track-index="2"></div>
      <div id="brand" class="t clip" data-start="0" data-duration="6.961" data-track-index="3">BOSPHORE SUR SEINE</div>
      <div id="t1" class="t mega clip" data-start="0.0" data-duration="4.64" data-track-index="4">J-1</div>
      <div id="t2" class="t sub clip" data-start="1.856" data-duration="2.784" data-track-index="4">Demain, on embarque.</div>
      <div id="endline" class="t clip" data-start="4.64" data-duration="2.321" data-track-index="4">Vendredi 27.11, sur la Seine</div>
      <div id="info" class="t clip" data-start="5.568" data-duration="1.393" data-track-index="5">Vendredi 27.11 · 20h30 → 4h<br />Péniche Le Marcounet · Pont Marie</div>
      <div id="cta" class="t clip" data-start="6.496" data-duration="0.465" data-track-index="6"><span>Lien juste en dessous ↓</span></div>
      <div id="credit" class="t clip" data-start="0" data-duration="6.961" data-track-index="7">Images : Horde × Baajar, Cabaret Sauvage, 2025</div>
      <audio id="music" src="assets/media/track.wav" data-start="0" data-duration="6.961" data-volume="1" data-fade-in="0.05" data-fade-out="1.2" data-track-index="8"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const B = 0.464;
      [["#s1",0.0,1.856,1.0,1.08],
["#s2",1.856,1.856,1.06,1.05],
["#s3",3.712,3.248,1.12,1.08]].forEach(([id,a,d,f,t]) => tl.fromTo(id, { scale: f }, { scale: t, duration: d, ease: "none" }, a));
      tl.set("#black", { opacity: 0 }, 0);
      [].forEach((t) => { tl.set("#black", { opacity: 1 }, t); tl.set("#black", { opacity: 0 }, t + B * 0.5); });
      [1.856, 3.712].forEach((t) => {
        tl.set("#shade", { opacity: 0.35 }, t);
        tl.to("#shade", { opacity: 1, duration: B * 0.8, ease: "power2.out" }, t + 0.01);
      });
      tl.fromTo("#t1", { scale: 1.14 }, { scale: 1, duration: 0.6, ease: "power3.out" }, 0.0);
      tl.fromTo("#t2", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.25, ease: "power3.out" }, 1.856);
      tl.fromTo("#endshade", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 4.64);
      tl.fromTo("#endline", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, 4.68);
      tl.fromTo("#info", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, 5.568);
      tl.fromTo("#cta", { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2)" }, 6.496);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
