    <style>
      @font-face { font-family: "Unbounded"; font-weight: 900; src: url("assets/fonts/unbounded-latin-900-normal.woff2") format("woff2"); }
      @font-face { font-family: "Fira Sans Condensed"; font-weight: 500; src: url("assets/fonts/fira-sans-condensed-latin-500-normal.woff2") format("woff2"); }
      @font-face { font-family: "Fira Sans Condensed"; font-weight: 700; src: url("assets/fonts/fira-sans-condensed-latin-700-normal.woff2") format("woff2"); }
      :root { --ink: #f6f2e6; --window: #decf58; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: "Fira Sans Condensed", sans-serif; color: var(--ink); }
      .shot { position: absolute; inset: 0; width: 1080px; height: 1920px; object-fit: cover; z-index: 1; }
      .full { position: absolute; inset: 0; }
      #shade { z-index: 2; background: linear-gradient(180deg, #000a 0%, #0004 24%, transparent 40%, transparent 72%, #000a 100%); }
      #black { z-index: 3; background: #000; }
      #endshade { z-index: 3; background: linear-gradient(180deg, #0d1330cc 0%, #0d1330aa 55%, #0d1330ee 100%); }
      .t { position: absolute; left: 0; width: 1080px; text-align: center; z-index: 10; text-wrap: balance; text-shadow: 0 4px 30px #0009; }
      #brand { top: 250px; font: 700 30px/1 "Fira Sans Condensed"; letter-spacing: 0.32em; opacity: 0.9; }
      .hook { top: 560px; padding: 0 70px; font: 900 170px/0.98 "Unbounded"; letter-spacing: -0.04em; }
      .line { top: 600px; padding: 0 120px; font: 900 90px/1.03 "Unbounded"; letter-spacing: -0.03em; }
      .mega { top: 520px; font: 900 300px/0.95 "Unbounded"; letter-spacing: -0.05em; }
      .sub { top: 860px; padding: 0 120px; font: 900 76px/1.05 "Unbounded"; letter-spacing: -0.03em; }
      .tag { top: 470px; font: 700 40px/1 "Fira Sans Condensed"; letter-spacing: 0.24em; color: var(--window); }
      #endline { top: 470px; padding: 0 130px; font: 900 88px/1.04 "Unbounded"; letter-spacing: -0.03em; }
      #info { top: 840px; font: 700 44px/1.35 "Fira Sans Condensed"; }
      #cta { top: 1020px; }
      #cta span { display: inline-block; padding: 18px 40px; border-radius: 999px; background: var(--window); color: #141a3a; font: 700 44px/1 "Fira Sans Condensed"; text-shadow: none; }
      #presented { top: 1224px; font: 500 25px/1 "Fira Sans Condensed"; letter-spacing: 0.06em; opacity: 0.8; }
      #credit { top: 1270px; font: 500 26px/1 "Fira Sans Condensed"; opacity: 0.75; }
    </style>
  </head>

      <video id="s6" class="shot clip" src="assets/media/p9.mp4" data-start="5.746" data-duration="0.958" data-media-start="14.0" data-track-index="0" muted playsinline></video>
      <video id="s7" class="shot clip" src="assets/media/p9.mp4" data-start="6.704" data-duration="0.958" data-media-start="13.0" data-track-index="0" muted playsinline></video>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const B = 0.4789;
      [["#s1",0.0,1.915,1.0,1.08],
["#s2",1.915,0.958,1.06,1.05],
["#s3",2.873,0.958,1.12,1.08],
["#s4",3.831,0.958,1.0,1.05],
["#s5",4.789,0.958,1.06,1.08],
["#s6",5.746,0.958,1.12,1.05],
["#s7",6.704,0.958,1.0,1.08],
["#s8",7.662,0.958,1.06,1.05],
["#s9",8.619,7.183,1.12,1.08]].forEach(([id,a,d,f,t]) => tl.fromTo(id, { scale: f }, { scale: t, duration: d, ease: "none" }, a));
      tl.set("#black", { opacity: 0 }, 0);
      [].forEach((t) => { tl.set("#black", { opacity: 1 }, t); tl.set("#black", { opacity: 0 }, t + B * 0.5); });
      [1.915, 2.873, 3.831, 4.789, 5.746, 6.704, 7.662, 8.619].forEach((t) => {
        tl.set("#shade", { opacity: 0.35 }, t);
        tl.to("#shade", { opacity: 1, duration: B * 0.8, ease: "power2.out" }, t + 0.01);
      });
      tl.fromTo("#t1", { scale: 1.14 }, { scale: 1, duration: 0.6, ease: "power3.out" }, 0.0);
      tl.fromTo("#t2", { scale: 1.14 }, { scale: 1, duration: 0.6, ease: "power3.out" }, 1.915);
      tl.fromTo("#t3", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.25, ease: "power3.out" }, 3.831);
      tl.fromTo("#t4", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.25, ease: "power3.out" }, 7.662);
      tl.fromTo("#endshade", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 11.492);
      tl.fromTo("#endline", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, 11.532);
      tl.fromTo("#info", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, 12.45);
      tl.fromTo("#cta", { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2)" }, 13.407);
      window.__timelines["main"] = tl;
    </script>
